(function(){

var SEED=JSON.parse(document.getElementById('seed').textContent);

function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(s){if(!s||typeof s!=='object')s=clone(SEED);ARR.forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});s.plan.forEach(function(d){if(!Array.isArray(d.i))d.i=[]});if(s.kf==null)s.kf=SEED.kf;if(!s.split)s.split=SEED.split;return s}
function load(){try{var l=JSON.parse(localStorage.getItem(KEY));if(l&&l.state){S=norm(l.state);return}}catch(e){}S=clone(SEED)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state:S}))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dots(n){return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function money(n){return(n<-0.5?'−':'')+'$'+dots(n)}
function dec(n){return String(Math.round(n*10)/10).replace('.',',')}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t}
function fam(id){for(var i=0;i<S.fams.length;i++)if(S.fams[i].id===id)return S.fams[i];return null}
function famName(id){var f=fam(id);return f?f.name:'Sin asignar'}
function mealD(id){for(var i=0;i<S.meals.length;i++)if(S.meals[i].id===id)return S.meals[i].d.toLowerCase();return''}
function uid(){return'x'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function people(){return{a:sum(S.fams,function(f){return f.ad}),k:sum(S.fams,function(f){return f.ki})}}
function eq(k){var p=people();return p.a+p.k*(k==null?S.kf:k)}
function qty(it){if(it.fix)return it.per;var st=it.step||1;return Math.ceil(it.per*eq(it.k)/st-1e-9)*st}
function est(it){var q=qty(it);return(it.unit==='g'||it.unit==='ml')?q/1000*it.price:q*it.price}
function cost(it){return it.done&&it.real>0?it.real:est(it)}
function fq(it){var q=qty(it);if(it.unit==='g')return q>=1000?dec(q/1000)+' kg':q+' g';if(it.unit==='ml')return q>=1000?dec(q/1000)+' L':q+' ml';return dec(q)+' '+it.unit}
function unitP(it){return it.unit==='g'?'kg':it.unit==='ml'?'litro':it.unit==='und'?'unidad':it.unit}

function cuentas(){
  var F=S.fams,n=F.length||1,W=F.map(function(f){return f.ad+f.ki*S.kf}),Wt=sum(W,function(x){return x})||1,r={},totFam=0,totIt=0,unas=0,all=0;
  F.forEach(function(f){r[f.id]={paid:0,pend:0,share:0,tin:0,tout:0,bal:0}});
  S.pays.forEach(function(p){all+=p.amount;if(r[p.by]){r[p.by].paid+=p.amount;totFam+=p.amount}else unas+=p.amount});
  S.items.forEach(function(it){var c=cost(it);all+=c;if(r[it.resp]){r[it.resp][it.done?'paid':'pend']+=c;totIt+=c}else unas+=c});
  S.trans.forEach(function(t){if(r[t.from]&&r[t.to]){r[t.from].tout+=t.amount;r[t.to].tin+=t.amount}});
  F.forEach(function(f,i){var x=r[f.id];x.share=totFam/n+(S.split==='persona'?totIt*W[i]/Wt:totIt/n);x.bal=x.paid+x.pend-x.share+x.tout-x.tin});
  var deb=[],cre=[],moves=[];
  F.forEach(function(f){var b=Math.round(r[f.id].bal);if(b<-500)deb.push({id:f.id,v:-b});else if(b>500)cre.push({id:f.id,v:b})});
  deb.sort(function(a,b){return b.v-a.v});cre.sort(function(a,b){return b.v-a.v});
  var i=0,j=0;while(i<deb.length&&j<cre.length){var m=Math.min(deb[i].v,cre[j].v);moves.push({from:deb[i].id,to:cre[j].id,v:m});deb[i].v-=m;cre[j].v-=m;if(deb[i].v<1)i++;if(cre[j].v<1)j++}
  return{r:r,all:all,unas:unas,moves:moves,n:n}
}

  h+='</div>';
  return h+foot();
}
function stepper(path,v){return'<span class="step"><button type="button" data-step="'+path+'" data-d="-1" aria-label="Menos">−</button><b class="num">'+v+'</b><button type="button" data-step="'+path+'" data-d="1" aria-label="Más">+</button></span>'}

  S.pays.forEach(function(p){h+='<div class="pay"><div class="g"><b>'+esc(p.concept)+'</b><div class="sm mut">'+(p.note?esc(p.note)+'. ':'')+'</div><select aria-label="Quién pagó" class="'+(fam(p.by)?'':'un')+'" style="margin-top:4px;font-size:14.5px" data-set="pays.'+p.id+'.by" data-type="str">'+famOpts(p.by,'Sin definir quién paga')+'</select></div><div style="text-align:right"><b class="num">'+money(p.amount)+'</b><br><button type="button" class="lnk d" data-del="pays.'+p.id+'">Quitar</button></div></div>'});
  h+='</div><div class="card"><label class="f">Nuevo gasto fijo<input type="text" id="pc" placeholder="Ej. peajes, propina"></label><div class="grid2"><label class="f">Valor<input type="text" inputmode="numeric" id="pa" placeholder="0"></label><label class="f">Quién pagó<select id="pb">'+famOpts('','Sin definir')+'</select></label></div><button type="button" class="btn o" data-add="pays">Agregar gasto</button></div>';
  h+='<h2>Transferencias entre familias</h2><div class="card">';
  if(!S.trans.length)h+='<span class="mut">Ninguna registrada.</span>';
  S.trans.forEach(function(t){h+='<div class="pay"><div class="g"><b>'+esc(famName(t.from))+'</b> a <b>'+esc(famName(t.to))+'</b>'+(t.note?'<div class="sm mut">'+esc(t.note)+'</div>':'')+'</div><div style="text-align:right"><b class="num">'+money(t.amount)+'</b><br><button type="button" class="lnk d" data-del="trans.'+t.id+'">Quitar</button></div></div>'});
  h+='</div><div class="card"><div class="grid2"><label class="f">Quién transfiere<select id="tf">'+famOpts(S.fams[1]?S.fams[1].id:'')+'</select></label><label class="f">A quién<select id="tt">'+famOpts(S.fams[0]?S.fams[0].id:'')+'</select></label></div><label class="f">Valor<input type="text" inputmode="numeric" id="ta" placeholder="0"></label><button type="button" class="btn o" data-add="trans">Registrar transferencia</button></div>';
  return h+foot();
}

function footMsg(){return mode==='live'?'Todo se guarda solo y las cinco familias lo ven al instante.':mode==='offline'?'Ahora no hay señal. Lo que marques se sube solo cuando vuelva, siempre que no cierres la página.':mode==='local'?'Falta conectar Firebase: por ahora los cambios se guardan solo en este teléfono.':mode==='error'?'No se pudo conectar con la base de datos. Revisa la configuración y las reglas de Firebase.':'Conectando con la base de datos…'}
function foot(){return'<h2>Cómo se guarda</h2><p class="sm mut" id="footmsg">'+footMsg()+'</p>'}

function txtLista(){
  var its=S.items.filter(function(i){return curFam?i.resp===curFam:!fam(i.resp)}),t='*Compras '+famName(curFam)+' · Paseo Villeta 14 al 16 nov*\n';
  S.meals.forEach(function(m){var a=its.filter(function(i){return i.meal===m.id});if(!a.length)return;t+='\n_'+m.d+': '+m.n+'_\n';a.forEach(function(it){t+=(it.done?'✅ ':'▫️ ')+it.name+': '+fq(it)+' (~'+money(cost(it))+')\n'})});
  return t+'\nTotal estimado: '+money(sum(its,cost));
}
function txtResumen(){
  var c=cuentas(),p=people(),t='*Paseo Villeta 14 al 16 nov*\n'+(p.a+p.k)+' personas ('+p.a+' adultos, '+p.k+' niños), '+S.fams.length+' familias\nPresupuesto total: '+money(c.all)+' (~'+money(c.all/c.n)+' por familia)\n';
  if(c.unas>0)t+='Sin responsable todavía: '+money(c.unas)+'\n';
  t+='\n*Cuentas*\n';
  S.fams.forEach(function(f){var x=c.r[f.id],b=Math.round(x.bal);t+=f.name+': aporta '+money(x.paid+x.pend)+', le corresponde '+money(x.share)+' → '+(b>500?'le deben '+money(b):b<-500?'debe '+money(-b):'al día')+'\n'});
  if(c.moves.length){t+='\n*Para cuadrar*\n';c.moves.forEach(function(m){t+=famName(m.from)+' → '+famName(m.to)+': '+money(m.v)+'\n'})}
  t+='\n*Quién lleva qué*\n';
  S.fams.forEach(function(f){var a=S.items.filter(function(i){return i.resp===f.id});t+=f.name+': '+(a.length?a.map(function(i){return i.name+' ('+fq(i)+')'}).join(', '):'nada asignado')+'\n'});
  return t;
}
function copy(t){
  function fb(){document.getElementById('st').value=t;document.getElementById('sheet').className='on';var a=document.getElementById('st');a.focus();a.select()}
  try{navigator.clipboard.writeText(t).then(function(){toast('Copiado. Pégalo en el grupo de WhatsApp.')},fb)}catch(e){fb()}
}
var tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='on';clearTimeout(tt);tt=setTimeout(function(){e.className=''},2600)}

function route(){var h=(location.hash||'').replace('#','');for(var i=0;i<TABS.length;i++)if(TABS[i][0]===h)return h;return'plan'}
function render(){
  var r=route(),v=r==='cantidades'?vCant():r==='compras'?vComp():r==='cuentas'?vCuen():vPlan();
  document.getElementById('view').innerHTML=v;
  var n='';TABS.forEach(function(t){n+='<a href="#'+t[0]+'"'+(t[0]===r?' aria-current="page"':'')+'>'+t[1]+'</a>'});
  document.getElementById('tabs').innerHTML=n;
}
function find(st,path){var p=path.split('.'),a=st[p[0]]||[];for(var i=0;i<a.length;i++)if(a[i].id===p[1])return{o:a[i],k:p[2],a:a,i:i};return null}
function pnum(v){var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)&&n>=0?n:null}
function pmoney(v){var d=String(v).replace(/\D/g,'');return d?parseInt(d,10):0}
function val(id){var e=document.getElementById(id);return e?e.value:''}

/* Cada cambio se aplica al instante en este teléfono y luego, como transacción,
   sobre la versión más reciente en Firebase: así dos familias pueden marcar
   cosas al mismo tiempo sin pisarse. */
function mut(fn){
  try{fn(S)}catch(e){}
  save();render();
  if(!ref)return;
  ref.transaction(function(cur){
    var st=null;if(typeof cur==='string'){try{st=JSON.parse(cur)}catch(e){}}
    st=norm(st||clone(SEED));try{fn(st)}catch(e){}
    return JSON.stringify(st);
  },function(err){if(err)toast('No se pudo guardar. Revisa la conexión e intenta de nuevo.')});
}
function editing(){var e=document.activeElement,v=document.getElementById('view');if(!e||!v||!v.contains(e))return false;var t=e.tagName;return t==='TEXTAREA'||t==='SELECT'||(t==='INPUT'&&e.type!=='checkbox')}
function setSync(){
  var m={live:['En vivo','ok'],offline:['Sin señal','w'],connecting:['Conectando…',''],local:['Sin conectar','w'],error:['Sin conexión','w']}[mode]||['',''];
  var e=document.getElementById('sync');if(e){e.textContent=m[0];e.className='sync '+m[1]}
  var f=document.getElementById('footmsg');if(f)f.textContent=footMsg();
}
function connect(){
  var c=window.FIREBASE_CONFIG;
  if(!window.firebase||!c||!c.apiKey||/PEGA/.test(c.apiKey)||!c.databaseURL){mode='local';setSync();return}
  try{
    firebase.initializeApp(c);
    var db=firebase.database();ref=db.ref('paseo/villeta');
    db.ref('.info/connected').on('value',function(s){if(mode!=='error'){mode=s.val()?'live':'offline';setSync()}});
    ref.on('value',function(snap){
      var v=snap.val();
      if(v==null){ref.transaction(function(cur){return cur==null?JSON.stringify(norm(clone(SEED))):undefined});return}
      try{S=norm(JSON.parse(v))}catch(e){return}
      save();
      if(editing())pend=true;else render();
    },function(){mode='error';ref=null;setSync()});
  }catch(e){mode='error';ref=null;setSync()}
}

document.getElementById('app').innerHTML='<main><div class="hd"><h1>Paseo a Villeta, 14 al 16 de noviembre</h1><span id="sync" class="sync"></span></div><div id="view"></div></main><nav><div id="tabs"></div></nav><div id="toast" role="status"></div><div id="sheet"><div><p><b>Mantén presionado para copiar</b></p><textarea id="st" readonly></textarea><div class="btns"><button type="button" class="btn o" id="sc">Cerrar</button></div></div></div>';
load();render();setSync();connect();
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
document.getElementById('sc').addEventListener('click',function(){document.getElementById('sheet').className=''});
var app=document.getElementById('app');
app.addEventListener('focusout',function(){setTimeout(function(){if(pend&&!editing()){pend=false;render()}},60)});
app.addEventListener('change',function(ev){
  var e=ev.target,path=e.getAttribute('data-set');if(!path)return;var t=e.getAttribute('data-type'),v;
  if(t==='bool')v=e.checked;else if(t==='money')v=pmoney(e.value);else if(t==='num'){v=pnum(e.value);if(v===null){render();return}}else if(t==='numnull'){v=e.value.trim()===''?null:pnum(e.value)}else v=e.value;
  mut(function(st){var f=find(st,path);if(f)f.o[f.k]=v});
});
app.addEventListener('click',function(ev){
  var e=ev.target.closest('button');if(!e)return;var a;
  if((a=e.getAttribute('data-step'))){var d=parseInt(e.getAttribute('data-d'),10);mut(function(st){var f=find(st,a);if(f)f.o[f.k]=Math.max(0,(f.o[f.k]||0)+d)})}
  else if((a=e.getAttribute('data-tog'))){open[a]=!open[a];render()}
  else if(e.hasAttribute('data-fam')){curFam=e.getAttribute('data-fam');render()}
  else if((a=e.getAttribute('data-split'))){mut(function(st){st.split=a})}
  else if((a=e.getAttribute('data-del'))){var p=a.split('.');mut(function(st){var arr=st[p[0]]||[];for(var i=0;i<arr.length;i++)if(arr[i].id===p[1]){arr.splice(i,1);break}})}
  else if((a=e.getAttribute('data-copy'))){copy(a==='lista'?txtLista():txtResumen())}
  else if((a=e.getAttribute('data-add'))){
    var o=null,col=a;
    if(a==='items'){var n=val('nn').trim();if(!n){toast('Escribe qué es.');return}o={id:uid(),meal:'otros',name:n,unit:'und',per:1,fix:true,price:pmoney(val('nc')),resp:val('nr'),done:false,real:0}}
    else if(a==='pays'){var c=val('pc').trim(),m=pmoney(val('pa'));if(!c||!m){toast('Falta el concepto o el valor.');return}o={id:uid(),concept:c,amount:m,by:val('pb'),note:''}}
    else if(a==='trans'){var fr=val('tf'),to=val('tt'),am=pmoney(val('ta'));if(!am||fr===to){toast('Revisa el valor y que sean familias distintas.');return}o={id:uid(),from:fr,to:to,amount:am,note:''}}
    if(o)mut(function(st){st[col].push(clone(o))});
  }
});
})();
</script></body></html>
